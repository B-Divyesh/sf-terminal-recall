name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:installers
      - run: npm run test:recording
      - run: npm run lint
      - run: cargo test --workspace

  verify-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run test:installers

  build:
    needs: [verify, verify-windows-installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: terminal-recall-linux-x86_64
            kind: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: terminal-recall-windows-x86_64
            kind: windows
          - os: macos-latest
            target: aarch64-apple-darwin
            name: terminal-recall-macos-arm64
            kind: macos
          - os: macos-latest
            target: x86_64-apple-darwin
            name: terminal-recall-macos-x86_64
            kind: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p terminal-recall
      - name: Package release files
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release/root/usr/local/bin
          if [[ "${{ matrix.kind }}" == "windows" ]]; then
            cp target/${{ matrix.target }}/release/terminal-recall.exe release/
            (cd release && 7z a ../${{ matrix.name }}.zip terminal-recall.exe)
          else
            cp target/${{ matrix.target }}/release/terminal-recall release/root/usr/local/bin/
            chmod 755 release/root/usr/local/bin/terminal-recall
            tar -czf ${{ matrix.name }}.tar.gz -C release/root/usr/local/bin terminal-recall
          fi
          if [[ "${{ matrix.kind }}" == "linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y rpm
            mkdir -p release/deb/DEBIAN release/deb/usr/local/bin
            printf 'Package: terminal-recall\nVersion: %s\nArchitecture: amd64\nMaintainer: Param Factory <factory@sociobot.in>\nDescription: Keep selected terminal output searchable and encrypted locally\n' "$version" > release/deb/DEBIAN/control
            cp release/root/usr/local/bin/terminal-recall release/deb/usr/local/bin/
            dpkg-deb --build release/deb terminal-recall-linux-x86_64.deb
            top="$PWD/release/rpm"
            mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            cp release/root/usr/local/bin/terminal-recall "$top/SOURCES/"
            printf 'Name: terminal-recall\nVersion: %s\nRelease: 1\nSummary: Keep selected terminal output searchable and encrypted locally\nLicense: MIT\nBuildArch: x86_64\n%%description\nKeep selected terminal output searchable and encrypted locally.\n%%install\nmkdir -p %%{buildroot}/usr/local/bin\ninstall -m 755 %%{_sourcedir}/terminal-recall %%{buildroot}/usr/local/bin/terminal-recall\n%%files\n/usr/local/bin/terminal-recall\n' "$version" > "$top/SPECS/terminal-recall.spec"
            rpmbuild --define "_topdir $top" -bb "$top/SPECS/terminal-recall.spec"
            cp "$top/RPMS/x86_64/terminal-recall-$version-1.x86_64.rpm" terminal-recall-linux-x86_64.rpm
          fi
          if [[ "${{ matrix.kind }}" == "macos" ]]; then
            pkgbuild --root release/root --identifier in.sociobot.terminal-recall --version "$version" ${{ matrix.name }}.pkg
          fi
      - name: Verify and record unsigned Windows binary
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          try {
            [System.Security.Cryptography.X509Certificates.X509Certificate2]::CreateFromSignedFile("release/terminal-recall.exe") | Out-Null
            throw "Windows binary is signed; update the public signing disclosure before release."
          } catch [System.Security.Cryptography.CryptographicException] {
            '{"platform":"windows","status":"unsigned"}' | Set-Content terminal-recall-signing-windows.json
          }
      - name: Verify and record unsigned macOS binary
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          if codesign --verify --strict release/root/usr/local/bin/terminal-recall 2>/dev/null; then
            echo "macOS binary is signed; update the public signing disclosure before release" >&2
            exit 1
          fi
          printf '{"platform":"%s","status":"unsigned"}\n' '${{ matrix.name }}' > 'terminal-recall-signing-${{ matrix.target }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: terminal-recall-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
      - name: Assemble manifests and checksums
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          find release -type f -exec cp {} . \;
          sha256sum terminal-recall-* > SHA256SUMS
          repo="$GITHUB_REPOSITORY"
          base="https://github.com/$repo/releases/download/$GITHUB_REF_NAME"
          printf '{"version":"%s","assets":{"linux":"%s/terminal-recall-linux-x86_64.tar.gz","windows":"%s/terminal-recall-windows-x86_64.zip","macos_arm64":"%s/terminal-recall-macos-arm64.tar.gz","macos_x86_64":"%s/terminal-recall-macos-x86_64.tar.gz"}}\n' "$version" "$base" "$base" "$base" "$base" > latest.json
          linux_hash=$(awk '$2=="terminal-recall-linux-x86_64.tar.gz" {print $1}' SHA256SUMS)
          windows_hash=$(awk '$2=="terminal-recall-windows-x86_64.zip" {print $1}' SHA256SUMS)
          mac_arm_hash=$(awk '$2=="terminal-recall-macos-arm64.tar.gz" {print $1}' SHA256SUMS)
          mac_x64_hash=$(awk '$2=="terminal-recall-macos-x86_64.tar.gz" {print $1}' SHA256SUMS)
          jq -s . terminal-recall-signing-*.json > SIGNING-STATUS.json
          mkdir -p Formula scoop-bucket winget
          printf 'class TerminalRecall < Formula\n  desc "Keep selected terminal output searchable and encrypted locally"\n  homepage "https://terminal-recall.sociobot.in"\n  version "%s"\n  on_macos do\n    if Hardware::CPU.arm?\n      url "%s/terminal-recall-macos-arm64.tar.gz"\n      sha256 "%s"\n    else\n      url "%s/terminal-recall-macos-x86_64.tar.gz"\n      sha256 "%s"\n    end\n  end\n  on_linux do\n    url "%s/terminal-recall-linux-x86_64.tar.gz"\n    sha256 "%s"\n  end\n  def install\n    bin.install "terminal-recall"\n  end\nend\n' "$version" "$base" "$mac_arm_hash" "$base" "$mac_x64_hash" "$base" "$linux_hash" > Formula/terminal-recall.rb
          printf '{"version":"%s","description":"Selected terminal output, kept local.","homepage":"https://terminal-recall.sociobot.in","license":"MIT","url":"%s/terminal-recall-windows-x86_64.zip","hash":"%s","bin":"terminal-recall.exe"}\n' "$version" "$base" "$windows_hash" > scoop-bucket/terminal-recall.json
          printf 'PackageIdentifier: ParamFactory.TerminalRecall\nPackageVersion: %s\nInstallerType: zip\nInstallers:\n  - Architecture: x64\n    InstallerUrl: %s/terminal-recall-windows-x86_64.zip\n    InstallerSha256: %s\n    NestedInstallerType: portable\n    NestedInstallerFiles:\n      - RelativeFilePath: terminal-recall.exe\n        PortableCommandAlias: terminal-recall\nManifestType: installer\nManifestVersion: 1.6.0\n' "$version" "$base" "$windows_hash" > winget/ParamFactory.TerminalRecall.installer.yaml
          printf 'PackageIdentifier: ParamFactory.TerminalRecall\nPackageVersion: %s\nDefaultLocale: en-US\nPublisher: Param Factory\nPackageName: Terminal Recall\nShortDescription: Keep selected terminal output searchable and local.\nLicense: MIT\nManifestType: defaultLocale\nManifestVersion: 1.6.0\n' "$version" > winget/ParamFactory.TerminalRecall.locale.en-US.yaml
          printf 'PackageIdentifier: ParamFactory.TerminalRecall\nPackageVersion: %s\nManifestType: version\nManifestVersion: 1.6.0\n' "$version" > winget/ParamFactory.TerminalRecall.yaml
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            terminal-recall-*
            SHA256SUMS
            SIGNING-STATUS.json
            latest.json
            Formula/terminal-recall.rb
            scoop-bucket/terminal-recall.json
            winget/*
