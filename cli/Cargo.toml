[package]
name = "terminal-recall"
version = "0.1.3"
edition = "2021"
description = "Keep selected terminal output searchable, encrypted, and exportable"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-terminal-recall"
homepage = "https://terminal-recall.sociobot.in"
documentation = "https://terminal-recall.sociobot.in"

[[bin]]
name = "terminal-recall"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
